<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Movilidad con IA</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Contenedor Principal Accesible -->
    <main id="contenedor-app">
        <h1 class="sr-only">Asistente Visual con Inteligencia Artificial</h1>
        
        <!-- Elemento de video oculto o de fondo para capturar frames -->
        <video id="video-camara" autoplay playsinline aria-hidden="true"></video>
        
        <!-- Panel de Texto de Gran Tamaño para Baja Visión (Requerimiento RNF-07) -->
        <div id="panel-lectura" aria-live="assertive">
            <p id="texto-estado">Sistema listo. Toca la pantalla para iniciar la exploración.</p>
        </div>

        <!-- Botón de Control Absoluto (Ocupa gran parte de la interfaz activa) -->
        <button id="btn-accion" aria-label="Iniciar asistente por voz">
            <span id="texto-boton">INICIAR ASISTENTE</span>
        </button>
    </main>

    <!-- Orquestación de Scripts del Cliente -->
    <script src="js/camara.js"></script>
    <script src="js/voz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
